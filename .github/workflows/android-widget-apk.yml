name: Build widget APK

on:
  push:
    branches: [claude/eager-babbage-fg9hm4]
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android-widget
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: todo-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/*.apk
