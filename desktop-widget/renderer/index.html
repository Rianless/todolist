<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: http://localhost:* http://127.0.0.1:*; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 하루</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget">
    <header class="bar" id="dragBar">
      <div class="bar-title">
        <strong id="monthLabel">나의 하루</strong>
        <span id="syncState" class="sync">불러오는 중</span>
      </div>
      <div class="bar-actions">
        <button id="btnRefresh" title="새로고침" aria-label="새로고침">⟳</button>
        <button id="btnPin" title="항상 위에 표시" aria-label="항상 위에 표시">📌</button>
        <button id="btnMin" title="최소화" aria-label="최소화">–</button>
        <button id="btnClose" title="트레이로 숨기기" aria-label="닫기">✕</button>
      </div>
    </header>

    <section class="week">
      <div class="week-nav">
        <button id="btnPrev" aria-label="이전 주">‹</button>
        <button id="btnToday">오늘</button>
        <button id="btnNext" aria-label="다음 주">›</button>
      </div>
      <div class="week-days" id="weekDays"></div>
    </section>

    <section class="agenda">
      <div class="agenda-head">
        <div>
          <div class="eyebrow" id="agendaEyebrow"></div>
          <h1 id="agendaTitle">오늘의 일정</h1>
        </div>
        <span class="count" id="agendaCount">0개</span>
      </div>
      <div class="list" id="agendaList"></div>
    </section>

    <footer class="foot">
      <button id="btnAdd" class="primary">+ 일정</button>
      <span class="foot-note">가계부·구독은 웹앱에서</span>
      <button id="btnWeb" class="link">웹앱 열기 ↗</button>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <form class="sheet" id="editor" autocomplete="off">
      <h2 id="editorTitle">새 일정</h2>
      <label>제목<input id="f_title" type="text" maxlength="100"></label>
      <div class="grid2">
        <label>날짜<input id="f_date" type="date"></label>
        <label class="check"><input id="f_allday" type="checkbox"> 종일</label>
      </div>
      <div class="grid2" id="timeRow">
        <label>시작<input id="f_start" type="time"></label>
        <label>종료<input id="f_end" type="time"></label>
      </div>
      <label>카테고리<select id="f_cat"></select></label>
      <label>장소<input id="f_loc" type="text" maxlength="100"></label>
      <label>메모<textarea id="f_memo" rows="2"></textarea></label>
      <p class="hint" id="editorHint"></p>
      <p class="error" id="editorError" hidden></p>
      <div class="actions">
        <button type="button" id="btnDelete" class="danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="btnCancel">취소</button>
        <button type="submit" id="btnSave" class="primary">저장</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
