<!DOCTYPE html>

<html lang="ko" data-theme="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>To Do List // Rianless</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#06070F">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="TDL">

<link rel="apple-touch-icon" href="/icon-192.png">

<style>

@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
/* SF Pro fallback stack */

/* ═══════════════════════════════════════
   iOS GLASS UI — THEME VARIABLES
═══════════════════════════════════════ */

:root {
  --transition-theme: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
  --font-sf: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  --font-kr: 'Noto Sans KR', -apple-system, sans-serif;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 26px;
}

[data-theme="dark"] {
  --bg:        #000000;
  --bg2:       #0a0a0f;
  --panel:     rgba(28, 28, 35, 0.85);
  --panel2:    rgba(38, 38, 48, 0.90);
  --glass:     rgba(255,255,255,0.06);
  --glass2:    rgba(255,255,255,0.10);
  --glass3:    rgba(255,255,255,0.04);
  --border:    rgba(255,255,255,0.10);
  --border2:   rgba(255,255,255,0.15);
  --blue:      #0A84FF;
  --indigo:    #5E5CE6;
  --teal:      #32D74B;
  --cyan:      #64D2FF;
  --pink:      #FF375F;
  --orange:    #FF9F0A;
  --yellow:    #FFD60A;
  --purple:    #BF5AF2;
  --text:      #FFFFFF;
  --text2:     rgba(255,255,255,0.65);
  --text3:     rgba(255,255,255,0.35);
  --red:       #FF453A;
  --green:     #30D158;
  --personal:  #BF5AF2;
  --accent:    #0A84FF;
  --tab-bg:    rgba(18,18,24,0.92);
  --tab-act:   rgba(10,132,255,0.15);
  --card-bg:   rgba(28,28,38,0.80);
  --input-bg:  rgba(255,255,255,0.07);
  --shadow:    0 8px 32px rgba(0,0,0,0.6);
  --shadow2:   0 2px 12px rgba(0,0,0,0.4);
  --blur:      blur(20px) saturate(1.8);
  --blur-sm:   blur(12px);
  --font-main: var(--font-sf);
  --font-title:var(--font-sf);
  --font-body: var(--font-sf);
  --scanlines: 0;
  --gradient-bg: radial-gradient(ellipse at 20% 0%, rgba(10,132,255,0.15) 0%, transparent 60%),
                 radial-gradient(ellipse at 80% 100%, rgba(94,92,230,0.12) 0%, transparent 60%),
                 #000000;
}

[data-theme="light"] {
  --bg:        #F2F2F7;
  --bg2:       #E5E5EA;
  --panel:     rgba(255,255,255,0.80);
  --panel2:    rgba(250,250,255,0.90);
  --glass:     rgba(255,255,255,0.70);
  --glass2:    rgba(255,255,255,0.90);
  --glass3:    rgba(255,255,255,0.50);
  --border:    rgba(0,0,0,0.08);
  --border2:   rgba(0,0,0,0.12);
  --blue:      #007AFF;
  --indigo:    #5856D6;
  --teal:      #34C759;
  --cyan:      #32ADE6;
  --pink:      #FF2D55;
  --orange:    #FF9500;
  --yellow:    #FFCC00;
  --purple:    #AF52DE;
  --text:      #000000;
  --text2:     rgba(0,0,0,0.60);
  --text3:     rgba(0,0,0,0.35);
  --red:       #FF3B30;
  --green:     #34C759;
  --personal:  #AF52DE;
  --accent:    #007AFF;
  --tab-bg:    rgba(242,242,247,0.92);
  --tab-act:   rgba(0,122,255,0.12);
  --card-bg:   rgba(255,255,255,0.80);
  --input-bg:  rgba(0,0,0,0.04);
  --shadow:    0 4px 20px rgba(0,0,0,0.10);
  --shadow2:   0 2px 8px rgba(0,0,0,0.07);
  --blur:      blur(20px) saturate(1.5);
  --blur-sm:   blur(10px);
  --font-main: var(--font-kr);
  --font-title:var(--font-kr);
  --font-body: var(--font-kr);
  --scanlines: 0;
  --gradient-bg: radial-gradient(ellipse at 30% 0%, rgba(0,122,255,0.08) 0%, transparent 50%),
                 radial-gradient(ellipse at 70% 100%, rgba(88,86,214,0.07) 0%, transparent 50%),
                 #F2F2F7;
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }

body {
  background: var(--gradient-bg);
  color: var(--text);
  font-family: var(--font-main);
  font-size: 15px;
  transition: var(--transition-theme);
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Remove scanlines and grid overlays */
body::before, body::after { display: none !important; }

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ── HEADER ── */
.app-header {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

[data-theme="dark"] .app-header {
  background: rgba(20,20,28,0.80);
}
[data-theme="dark"] .app-header::after { display: none; }

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.header-left { flex: 1; min-width: 0; }

.header-controls {
  padding-top: 4px;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 6px;
}

.header-sys {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.2px;
  line-height: 1;
  height: 14px;
  display: flex;
  align-items: center;
  font-weight: 400;
}

[data-theme="dark"] .header-sys { color: rgba(100,210,255,0.5); }

.header-title {
  font-family: var(--font-main);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
  margin-top: 2px;
  line-height: 1.2;
  height: 28px;
  display: flex;
  align-items: center;
}

[data-theme="dark"] .header-title { text-shadow: none; animation: none; }
[data-theme="dark"] .header-title span { color: var(--blue); }

.header-badges {
  display: flex;
  gap: 5px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.hbadge {
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.2px;
  font-weight: 500;
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  color: var(--text3);
}

[data-theme="dark"] .hbadge { font-family: var(--font-sf); }
[data-theme="dark"] .hbadge-c { border-color: rgba(10,132,255,0.4); color: var(--blue); background: rgba(10,132,255,0.12); }
[data-theme="dark"] .hbadge-m { border-color: rgba(191,90,242,0.4); color: var(--purple); background: rgba(191,90,242,0.10); }
[data-theme="dark"] .hbadge-p { border-color: rgba(255,255,255,0.12); color: var(--text3); }
[data-theme="light"] .hbadge-c { border-color: rgba(0,122,255,0.25); color: var(--blue); background: rgba(0,122,255,0.08); }
[data-theme="light"] .hbadge-m { border-color: rgba(88,86,214,0.25); color: var(--indigo); background: rgba(88,86,214,0.07); }
[data-theme="light"] .hbadge-p { border-color: var(--border); color: var(--text3); }

.theme-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border2);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text2);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 15px;
  transition: all 0.2s;
  flex-shrink: 0;
}

.theme-btn:hover { border-color: var(--accent); background: var(--tab-act); }

/* ── PROGRESS ── */
.progress-bar-wrap {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px;
}

.prog-label { font-size: 11px; color: var(--text3); letter-spacing: 0.2px; white-space: nowrap; font-weight: 500; }
[data-theme="light"] .prog-label { color: var(--text2); }

.prog-track {
  flex:1; height:4px;
  background: var(--border);
  overflow:hidden;
  border-radius: 100px;
}

.prog-fill {
  height:100%;
  background: linear-gradient(90deg, var(--blue), var(--indigo));
  width:0%;
  transition:width .6s cubic-bezier(0.4,0,0.2,1);
  border-radius: 100px;
  box-shadow: none;
}

.prog-pct {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  min-width: 34px;
  text-align:right;
}

/* ── HEADER SYS-EXTRA ── */
.header-sys-extra {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  letter-spacing: 0.2px;
  line-height: 1.6;
  display: block;
  color: var(--text3);
}

/* ── MAIN SCROLL AREA ── */
#mainContent {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 0;
}

#mainContent::-webkit-scrollbar { width: 2px; }
#mainContent::-webkit-scrollbar-track { background: transparent; }
#mainContent::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 100px; }

/* ── BOTTOM TAB BAR ── */
.tab-bar {
  flex-shrink: 0;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] .tab-bar { background: rgba(18,18,26,0.88); }

.tab-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 4px 6px;
  cursor: pointer;
  background: none; border: none;
  color: var(--text3);
  transition: all 0.2s;
  position: relative;
  gap: 3px;
}

.tab-item.active { color: var(--accent); }

.tab-item::before {
  content:'';
  position:absolute; top:0; left:25%; right:25%; height:2px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  border-radius: 0 0 4px 4px;
}

.tab-item.active::before { transform: scaleX(1); }
.tab-icon { font-size: 20px; line-height: 1; }
.tab-label { font-size: 10px; letter-spacing: 0.2px; font-weight: 500; }

/* ═══════════════════════════════════════
   SECTION VIEWS
═══════════════════════════════════════ */
.view { display: none; }
.view.active { display: block; }

/* ── TOP ACTION BAR (List view) ── */
.action-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}

.today-btn {
  font-family: var(--font-main);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 16px;
  border: 1px solid var(--border2);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text2);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  white-space: nowrap;
  clip-path: none;
}

.today-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--tab-act); }
[data-theme="dark"] .today-btn { clip-path: none; border-radius: var(--radius-sm); }

.add-btn {
  flex: 1;
  font-family: var(--font-main);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 16px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  text-align: center;
  clip-path: none;
}

.add-btn:hover { opacity: 0.85; }
[data-theme="dark"] .add-btn { clip-path: none; border-radius: var(--radius-sm); color: #fff; }
[data-theme="light"] .add-btn { color: #fff; background: var(--accent); border-color: transparent; }

/* ── FILTER CHIPS ── */
.filter-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }

.fchip {
  font-family: var(--font-main);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  border-radius: 100px;
  transition: all 0.2s;
  flex-shrink: 0;
}

.fchip:hover, .fchip.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--tab-act);
}

.fchip.personal { border-color: rgba(191,90,242,0.3); color: var(--text2); }
.fchip.personal:hover, .fchip.personal.active {
  border-color: var(--personal); color: var(--personal);
  background: rgba(191,90,242,0.10);
}

/* ═══════════════════════════════════════
   CATEGORY COLORS
═══════════════════════════════════════ */
.cat-밀착상담   { --cc:#FF453A; }
.cat-자신감회복  { --cc:#FFD60A; }
.cat-취업역량강화 { --cc:#64D2FF; }
.cat-진로탐색   { --cc:#30D158; }
.cat-지역맞춤형  { --cc:#FF9F0A; }
.cat-사례관리   { --cc:#BF5AF2; }
.cat-개인      { --cc:#FF375F; }
.cat-자율      { --cc:rgba(255,255,255,0.25); }

[data-theme="light"] .cat-취업역량강화 { --cc:#007AFF; }
[data-theme="light"] .cat-진로탐색   { --cc:#34C759; }

/* ═══════════════════════════════════════
   DATE DIVIDER
═══════════════════════════════════════ */
.date-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0 8px;
}
.date-divider:first-child { margin-top: 0; }

.dd-text {
  font-family: var(--font-main);
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.2px;
  white-space: nowrap;
}

.dd-line { flex:1; height:1px; background: var(--border); }
[data-theme="dark"] .dd-line { background: rgba(255,255,255,0.08); }

.dd-count { font-size: 11px; color: var(--text3); font-weight: 500; }

/* ═══════════════════════════════════════
   TODO ITEM CARD
═══════════════════════════════════════ */
.todo-card {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cc, rgba(255,255,255,0.15));
  padding: 12px 14px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  border-radius: var(--radius-md);
  clip-path: none;
  box-shadow: var(--shadow2);
}

[data-theme="dark"] .todo-card {
  background: rgba(255,255,255,0.06);
  clip-path: none;
  border-radius: var(--radius-md);
  border-color: rgba(255,255,255,0.10);
}

[data-theme="light"] .todo-card { box-shadow: var(--shadow2); }

.todo-card:active { opacity: 0.75; transform: scale(0.99); }
.todo-card.done { opacity: 0.4; }

.todo-card.secret-locked .secret-mask { display: flex; }
.todo-card.secret-locked .todo-real { display: none; }
.todo-card.secret-unlocked .secret-mask { display: none; }
.todo-card.secret-unlocked .todo-real { display: block; }

.secret-mask {
  display: none;
  align-items: center; gap: 10px;
}
.secret-icon { font-size: 16px; color: var(--purple); opacity: 0.8; }
.secret-text { font-size: 12px; color: var(--text3); letter-spacing: 0.3px; }
[data-theme="light"] .secret-text { color: var(--text3); }

.todo-row { display: flex; align-items: flex-start; gap: 10px; }

.priority-bar {
  width: 3px; border-radius: 100px; flex-shrink: 0;
  align-self: stretch; min-height: 20px;
}
.p-high   { background: var(--red); box-shadow: none; }
.p-mid    { background: var(--yellow); }
.p-low    { background: var(--green); opacity: 0.8; }
.p-none   { background: transparent; }

.todo-body { flex: 1; min-width: 0; }

.todo-meta {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 4px; flex-wrap: wrap;
}

.cat-badge {
  font-size: 10px; padding: 2px 8px;
  color: var(--cc, var(--text3));
  background: color-mix(in srgb, var(--cc, var(--text3)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--cc, var(--text3)) 30%, transparent);
  border-radius: 100px;
  opacity: 1;
  flex-shrink: 0;
  font-weight: 500;
}

.todo-time { font-size: 11px; color: var(--text3); font-weight: 400; }

.allday-label {
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
}
.allday-label-text { font-size: 13px; color: var(--text2); font-weight: 500; }
[data-theme="dark"] .allday-label-text { color: var(--text2); opacity: 1; }

.allday-badge {
  display: inline-block;
  font-size: 10px; padding: 2px 9px;
  border: 1px solid rgba(10,132,255,0.4); border-radius: 100px;
  color: var(--accent); background: rgba(10,132,255,0.10);
  font-weight: 500;
}
[data-theme="dark"] .allday-badge { background: rgba(10,132,255,0.12); }
.importance-star { font-size: 11px; }

.todo-title {
  font-family: var(--font-main);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
[data-theme="light"] .todo-title { font-size: 15px; }
.todo-card.done .todo-title { text-decoration: line-through; text-decoration-color: var(--text3); }

.todo-sub { font-size: 12px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.corner-d { display: none !important; }

/* ═══════════════════════════════════════
   CALENDAR VIEW
═══════════════════════════════════════ */
.cal-nav {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}
.cal-nav .cal-month { flex: 1; text-align: center; }
.cal-nav-row1 { display: flex; justify-content: space-between; align-items: center; }
.cal-nav-row2 { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.cal-nav-right { display: flex; align-items: center; gap: 6px; }

.cal-arrow {
  font-size: 20px; background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  color: var(--accent); padding: 6px 16px; cursor: pointer;
  border-radius: var(--radius-sm); transition: all 0.2s; line-height: 1;
  flex-shrink: 0; font-weight: 300;
}
.cal-arrow:hover { background: var(--tab-act); }

.cal-today-btn {
  font-size: 12px; font-family: var(--font-main); font-weight: 600;
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  color: var(--accent); padding: 6px 12px; cursor: pointer;
  border-radius: var(--radius-sm); transition: all 0.2s;
  flex-shrink: 0;
}
.cal-today-btn:hover { background: var(--tab-act); }

.cal-month {
  font-family: var(--font-main);
  font-size: 16px; color: var(--text); letter-spacing: -0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-align: center; flex: 1; font-weight: 700;
}
[data-theme="light"] .cal-month { font-size: 16px; font-weight: 700; color: var(--text); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.cal-dow {
  font-size: 11px; color: var(--text3); text-align: center;
  padding: 4px 0; font-weight: 600; letter-spacing: 0.5px;
}
[data-theme="light"] .cal-dow { font-size: 12px; }
.cal-dow.sun { color: var(--red); }
.cal-dow.sat { color: var(--blue); }

.cal-cell {
  background: var(--glass3);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  height: 68px;
  padding: 5px 4px 4px;
  overflow: hidden;
  position: relative;
  cursor: default;
  transition: background 0.15s;
  border-radius: var(--radius-sm);
  clip-path: none;
}

[data-theme="dark"] .cal-cell {
  background: rgba(255,255,255,0.04);
  clip-path: none;
  border-radius: var(--radius-sm);
}
[data-theme="light"] .cal-cell { border-radius: var(--radius-sm); }
.cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
.cal-cell.today { border-color: var(--accent); background: rgba(10,132,255,0.08); }
[data-theme="dark"] .cal-cell.today { background: rgba(10,132,255,0.10); }
[data-theme="light"] .cal-cell.today { background: rgba(0,122,255,0.08); }
.cal-cell.has-events { cursor: pointer; }
.cal-cell.has-events:active { opacity: 0.75; }

.cal-daynum {
  font-family: var(--font-main);
  font-size: 12px; color: var(--text2);
  display: block; line-height: 1; margin-bottom: 3px;
  font-weight: 500;
}
[data-theme="light"] .cal-daynum { font-size: 12px; font-weight: 500; color: var(--text2); }
.cal-cell.today .cal-daynum {
  color: #fff; font-weight: 700;
  background: var(--accent);
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.cal-cell.sun .cal-daynum { color: var(--red); }
.cal-cell.sat .cal-daynum { color: var(--blue); }

.cal-dot {
  display: block; font-size: 6px;
  padding: 1px 5px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.4;
  border-radius: 100px;
  font-weight: 500;
  color: #fff;
  background: var(--cc, rgba(255,255,255,0.3));
  border: none;
  text-shadow: none;
  box-shadow: none;
}
[data-theme="dark"] .cal-dot {
  font-family: var(--font-sf);
  letter-spacing: 0.1px;
}
[data-theme="light"] .cal-dot {
  color: #fff;
  font-weight: 600;
  border-radius: 100px;
}
.cal-dot.done { opacity: 0.4; text-decoration: line-through; }
.cal-more { font-size: 8px; color: var(--accent); padding: 1px 3px; font-weight: 600; }

/* ═══════════════════════════════════════
   NOTES VIEW
═══════════════════════════════════════ */
.notes-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.section-title {
  font-family: var(--font-main);
  font-size: 18px; color: var(--text); letter-spacing: -0.3px; font-weight: 700;
}

.note-card {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 14px;
  margin-bottom: 8px;
  border-radius: var(--radius-md);
  cursor: pointer;
  clip-path: none;
  box-shadow: var(--shadow2);
}
[data-theme="dark"] .note-card {
  background: rgba(255,255,255,0.06);
  clip-path: none;
  border-radius: var(--radius-md);
}
.note-card:active { opacity: 0.75; }
.note-date { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
.note-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.note-content { font-size: 13px; color: var(--text2); line-height: 1.6; }
.note-empty { text-align: center; color: var(--text3); padding: 40px 20px; font-size: 14px; }

/* ═══════════════════════════════════════
   STATS VIEW
═══════════════════════════════════════ */
.stats-tabs {
  display: flex; gap: 4px; margin-bottom: 14px;
}
.stab {
  flex: 1; padding: 8px; border: 1px solid var(--border);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text3);
  font-family: var(--font-main); font-size: 13px; font-weight: 500;
  cursor: pointer; text-align: center; border-radius: var(--radius-sm); transition: all 0.2s;
}
.stab.active { border-color: var(--accent); color: var(--accent); background: var(--tab-act); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.stat-card {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  padding: 16px 14px;
  border-radius: var(--radius-md);
  text-align: center;
  clip-path: none;
  box-shadow: var(--shadow2);
}
[data-theme="dark"] .stat-card { clip-path: none; border-radius: var(--radius-md); }

.stat-num { font-size: 32px; color: var(--accent); line-height: 1; font-weight: 700; letter-spacing: -1px; }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 4px; font-weight: 500; }

.stat-bar-section { margin-bottom: 14px; }
.stat-bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; }
.sbl-text { font-size: 12px; color: var(--text2); font-weight: 500; }
.sbl-num { font-size: 12px; color: var(--accent); font-weight: 600; }
.stat-bar { height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; margin-bottom: 8px; }
.stat-bar-fill { height: 100%; border-radius: 100px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

.cat-stats { }
.cat-stat-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.csr-label { font-size: 12px; color: var(--text2); min-width: 80px; font-weight: 500; }
.csr-bar { flex:1; height:5px; background: var(--border); border-radius:100px; overflow:hidden; }
.csr-fill { height:100%; border-radius:100px; }
.csr-num { font-size: 11px; color: var(--text3); min-width: 24px; text-align:right; font-weight: 500; }

/* ═══════════════════════════════════════
   SUBSCRIPTIONS VIEW
═══════════════════════════════════════ */
.sub-card {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-left: 3px solid var(--purple);
  padding: 14px; margin-bottom: 8px;
  border-radius: var(--radius-md);
  cursor: pointer;
  clip-path: none;
  box-shadow: var(--shadow2);
}
[data-theme="dark"] .sub-card { clip-path: none; border-radius: var(--radius-md); }
.sub-card:active { opacity: 0.75; }

.sub-name { font-size: 16px; font-weight: 700; color: var(--text); }
.sub-amount { font-size: 17px; font-weight: 700; color: var(--accent); }
.sub-meta { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 400; }
.sub-total {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--accent);
  padding: 14px; text-align: center; margin-bottom: 14px;
  border-radius: var(--radius-md);
}
.sub-total-label { font-size: 11px; color: var(--text3); letter-spacing: 0.5px; font-weight: 500; }
.sub-total-amount { font-size: 26px; color: var(--accent); margin-top: 2px; font-weight: 700; letter-spacing: -0.5px; }
.sub-empty { text-align:center; color:var(--text3); padding:40px 20px; font-size:14px; }

/* ═══════════════════════════════════════
   MODALS
═══════════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9000;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  align-items: flex-end;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  background: var(--panel);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-top: 1px solid var(--border);
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 0 0 env(safe-area-inset-bottom,12px);
  max-height: 92dvh;
  overflow-y: auto;
  position: relative;
}

[data-theme="dark"] .modal-sheet {
  background: rgba(22,22,32,0.92);
  border-top-color: rgba(255,255,255,0.15);
  box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
}
[data-theme="light"] .modal-sheet {
  background: rgba(248,248,255,0.95);
  box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--border2); border-radius: 100px;
  margin: 10px auto 0;
}

.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}

.modal-title {
  font-family: var(--font-main);
  font-size: 17px; color: var(--text); font-weight: 700; letter-spacing: -0.3px;
}
[data-theme="light"] .modal-title { color: var(--text); }

.modal-close {
  background:none; border:none; color:var(--text3);
  font-size:22px; cursor:pointer; padding:0 2px; line-height:1;
}
.modal-close:hover { color:var(--text); }

.modal-body { padding: 16px 20px; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 13px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 6px; }
[data-theme="light"] .form-label { color: var(--text2); }

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-main);
  font-size: 15px;
  padding: 12px 14px;
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
  border-radius: var(--radius-sm);
  -webkit-appearance: none;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
}
[data-theme="dark"] .form-input:focus,
[data-theme="dark"] .form-select:focus,
[data-theme="dark"] .form-textarea:focus {
  box-shadow: 0 0 0 3px rgba(10,132,255,0.20);
}
.form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.form-select option { background: var(--panel2); color: var(--text); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-error { border-color: var(--red) !important; }

/* Toggle switches */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.toggle-label { font-size: 15px; color: var(--text); font-weight: 500; }
.toggle-switch {
  width: 51px; height: 31px; background: var(--border2);
  border-radius: 100px; position: relative; cursor: pointer;
  transition: background 0.2s; flex-shrink:0;
}
.toggle-switch.on { background: var(--green); }
.toggle-switch::after {
  content:''; position:absolute; top:2px; left:2px;
  width:27px; height:27px; background:white; border-radius:50%;
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.toggle-switch.on::after { transform: translateX(20px); }

/* Priority select */
.priority-row { display: flex; gap: 8px; margin-top: 4px; }
.prio-btn {
  flex:1; padding: 10px 4px; border: 1px solid var(--border);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text3); cursor: pointer;
  border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-main);
  transition: all 0.2s; text-align: center; font-weight: 500;
}
.prio-btn.active-high { border-color: var(--red); color: var(--red); background: rgba(255,69,58,0.10); }
.prio-btn.active-mid { border-color: var(--yellow); color: var(--yellow); background: rgba(255,214,10,0.10); }
.prio-btn.active-low { border-color: var(--green); color: var(--green); background: rgba(48,209,88,0.10); }
.prio-btn.active-none { border-color: var(--border); color: var(--text3); }

/* Modal actions */
.modal-actions { display: flex; gap: 10px; padding: 0 20px 20px; }

.btn-cancel {
  flex: 1; padding: 14px; border: 1px solid var(--border);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text2); cursor: pointer;
  font-family: var(--font-main); font-size: 15px; border-radius: var(--radius-sm);
  transition: all 0.2s; font-weight: 600;
}
.btn-cancel:hover { border-color: var(--text2); }

.btn-save {
  flex: 2; padding: 14px; border: none;
  background: var(--accent); color: #fff; cursor: pointer;
  font-family: var(--font-main); font-size: 15px; border-radius: var(--radius-sm);
  transition: all 0.2s; font-weight: 700;
}
.btn-save:hover { opacity: 0.85; }

/* Center popup modals */
.add-overlay, .detail-overlay, .search-overlay {
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.detail-sheet {
  border-radius: var(--radius-xl) !important;
  border-top: none !important;
  border: 1px solid var(--border) !important;
  background: var(--panel) !important;
  -webkit-backdrop-filter: var(--blur) !important;
  backdrop-filter: var(--blur) !important;
  width: 100%;
  max-width: 400px;
  max-height: 82dvh;
  margin: 0 !important;
  position: relative;
  animation: detailIn 0.22s cubic-bezier(0.2,0,0.2,1);
  box-shadow: var(--shadow) !important;
}

@keyframes detailIn {
  from { opacity:0; transform:scale(0.94) translateY(10px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

[data-theme="dark"] .detail-sheet {
  background: rgba(22,22,32,0.95) !important;
  border-color: rgba(255,255,255,0.12) !important;
  box-shadow: 0 16px 60px rgba(0,0,0,0.7) !important;
}
[data-theme="light"] .detail-sheet {
  background: rgba(248,248,255,0.97) !important;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15) !important;
}

.detail-sheet .modal-handle, .add-sheet .modal-handle, .day-sheet .modal-handle { display: none; }
.detail-sheet .modal-header { align-items: flex-start; }
.detail-sheet .modal-title  { flex: 1; min-width: 0; white-space: normal; line-height: 1.5; padding-right: 6px; }

.add-sheet, .day-sheet, .detail-sheet {
  overflow: hidden !important;
  display: flex;
  flex-direction: column;
}
.sheet-scroll { overflow-y: auto; flex: 1; }

.add-sheet, .day-sheet {
  border-radius: var(--radius-xl) !important;
  border-top: none !important;
  border: 1px solid var(--border);
  background: var(--panel);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  width: 100%;
  max-width: 440px;
  max-height: 88dvh;
  margin: 0 !important;
  position: relative;
  animation: detailIn 0.22s cubic-bezier(0.2,0,0.2,1);
  padding-bottom: 0;
  box-shadow: var(--shadow);
}

[data-theme="dark"] .add-sheet, [data-theme="dark"] .day-sheet {
  background: rgba(22,22,32,0.95);
  border-color: rgba(255,255,255,0.12);
  box-shadow: 0 16px 60px rgba(0,0,0,0.7);
}
[data-theme="light"] .add-sheet, [data-theme="light"] .day-sheet {
  background: rgba(248,248,255,0.97);
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}

/* 코너 장식 제거 */
.dc { display: none !important; }

.detail-actions {
  display: flex; gap: 8px;
  padding: 0 20px 20px;
  flex-wrap: wrap;
}

.detail-btn {
  flex: 1; min-width: 70px;
  padding: 11px 8px; border: 1px solid var(--border);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text2); cursor: pointer;
  font-family: var(--font-main); font-size: 13px; border-radius: var(--radius-sm);
  transition: all 0.2s; text-align: center; font-weight: 600;
}
.detail-btn:hover { border-color: var(--accent); color: var(--accent); }
.detail-btn.done-btn { border-color: rgba(48,209,88,0.4); color: var(--green); }
.detail-btn.done-btn.checked { background: rgba(48,209,88,0.10); }
.detail-btn.edit-btn { border-color: rgba(255,214,10,0.4); color: var(--yellow); }
.detail-btn.del-btn { border-color: rgba(255,69,58,0.4); color: var(--red); }

.detail-info { padding: 0 20px 14px; }
.detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.dr-key { font-size: 13px; color: var(--text3); font-weight: 500; }
.dr-val { font-size: 13px; color: var(--text); text-align: right; max-width: 60%; font-weight: 500; }

.detail-note-box {
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px; margin: 0 20px 14px;
  font-size: 14px; color: var(--text2); line-height: 1.6;
}

.detail-content-box {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; margin: 0 20px 14px;
  font-size: 14px; color: var(--text); line-height: 1.75;
  white-space: pre-wrap; word-break: break-word;
  background: var(--input-bg);
}
[data-theme="dark"] .detail-content-box { background: rgba(255,255,255,0.05); }

.detail-content-label {
  font-size: 12px; color: var(--text3); font-weight: 600;
  margin: 14px 20px 4px; display: block;
}

/* ═══════════════════════════════════════
   CATEGORIES MODAL
═══════════════════════════════════════ */
.cat-list { }
.cat-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  transition: opacity 0.15s;
}
.cat-item.dragging { opacity: 0.35; }
.cat-item.drag-over-cat { border-top: 2px solid var(--accent); }
.cat-drag-handle { cursor: grab; color: var(--text3); font-size: 16px; padding: 0 2px; touch-action: none; flex-shrink: 0; user-select: none; }
.cat-drag-handle:active { cursor: grabbing; }

/* calendar drag */
.cal-dot[draggable="true"] { cursor: grab; }
.cal-dot[draggable="true"]:active { cursor: grabbing; }
.cal-dot.drag-ready { opacity: 0.6; outline: 2px dashed var(--accent); border-radius: var(--radius-sm); }
.cal-cell.drag-over { background: rgba(10,132,255,0.12) !important; outline: 2px dashed var(--accent); }
[data-theme="light"] .cal-cell.drag-over { background: rgba(0,122,255,0.10) !important; }

#calDragGhost {
  position: fixed; pointer-events: none; z-index: 9999;
  opacity: 0.85; font-size: 11px;
  background: var(--panel);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  padding: 4px 10px; color: var(--accent); white-space: nowrap;
  transform: translate(-50%, -110%);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  display: none;
}

.cat-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink:0; }
.cat-name { flex:1; font-size: 15px; color: var(--text); font-weight: 500; }
.cat-actions { display:flex; gap:6px; }
.cat-act-btn {
  font-size: 12px; padding: 5px 12px; border: 1px solid var(--border);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text3); cursor: pointer; border-radius: var(--radius-sm);
  font-weight: 500;
}
.cat-act-btn:hover { border-color: var(--accent); color: var(--accent); }
.cat-act-btn.del { border-color: rgba(255,69,58,0.3); color: var(--red); opacity:0.7; }
.cat-act-btn.del:hover { opacity:1; }

.cat-edit-form {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px;
  margin: 6px 0;
  display: flex; flex-direction: column; gap: 10px;
}
.cat-edit-input {
  flex: 1; background: var(--input-bg); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-sm); padding: 9px 12px;
  font-family: var(--font-main); font-size: 14px; width: 100%;
}
.cat-edit-input:focus { outline: none; border-color: var(--accent); }
.cat-edit-btns { display: flex; gap: 8px; }
.cat-edit-btns .btn-cancel { flex:1; padding: 9px; }
.cat-edit-btns .btn-save   { flex:2; padding: 9px; }

.add-cat-btn {
  width:100%; padding:12px; border:1px dashed var(--border);
  background:transparent; color:var(--accent); cursor:pointer;
  border-radius:var(--radius-md); margin-top:8px; font-family:var(--font-main); font-size:14px;
  transition: all 0.2s; font-weight: 600;
}
.add-cat-btn:hover { border-color:var(--accent); background: var(--tab-act); }

/* Color picker */
.color-swatches { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.color-swatch {
  width:26px; height:26px; border-radius:50%; cursor:pointer;
  border: 2px solid transparent; transition: border 0.15s, transform 0.1s;
}
.color-swatch:active { transform: scale(0.9); }
.color-swatch.selected { border-color: var(--text); transform: scale(1.15); }

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
.empty-state { text-align:center; padding:40px 20px; color:var(--text3); font-size:14px; line-height:1.8; }

.section-subtitle { font-size:12px; color:var(--text3); margin-bottom:10px; font-weight:500; }

/* ═══════════════════════════════════════
   MYPAGE VIEW — ACCORDION CARDS
═══════════════════════════════════════ */
.mypage-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 14px;
}

.mp-card {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: box-shadow 0.2s, border-color 0.2s;
}
[data-theme="light"] .mp-card { box-shadow: var(--shadow2); }
[data-theme="dark"] .mp-card { border-color: rgba(255,255,255,0.10); }
[data-theme="dark"] .mp-card.open { border-color: rgba(10,132,255,0.35); box-shadow: 0 0 20px rgba(10,132,255,0.08); }
[data-theme="light"] .mp-card.open { box-shadow: 0 4px 20px rgba(0,0,0,0.10); border-color: rgba(0,122,255,0.3); }

.mp-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 18px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.15s;
}
.mp-card-header:active { opacity: 0.7; }
.mp-card-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }

.mp-card-label {
  flex: 1;
  font-family: var(--font-main);
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.2px;
}
[data-theme="dark"] .mp-card-label { font-family: var(--font-sf); font-size: 16px; letter-spacing: -0.2px; }

.mp-card-chevron { font-size: 12px; color: var(--text3); transition: transform 0.25s ease; flex-shrink: 0; }
.mp-card.open .mp-card-chevron { transform: rotate(180deg); color: var(--accent); }

.mp-card-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
.mp-card.open .mp-card-body { max-height: 2000px; }
.mp-card-inner { padding: 0 18px 18px; border-top: 1px solid var(--border); }

.mp-stats-tabs { display: flex; gap: 4px; padding: 14px 0 10px; margin-bottom: 4px; }

.mp-section-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 8px; }
.mp-section-label { font-size: 13px; color: var(--text3); font-weight: 600; }
[data-theme="light"] .mp-section-label { color: var(--text2); }

.cat-group-label {
  font-size: 11px; color: var(--purple); font-weight: 600;
  padding: 4px 0 2px; display: block;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}

.cat-select-group { background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.cat-select-group select { border: none; background: transparent; }

.mypage-add-sub-btn {
  width: 100%; padding: 12px; border: 1px dashed rgba(191,90,242,0.4);
  background: rgba(191,90,242,0.06); color: var(--purple); cursor: pointer;
  border-radius: var(--radius-sm); font-family: var(--font-main); font-size: 14px;
  transition: all 0.2s; margin-top: 6px; font-weight: 600;
}
.mypage-add-sub-btn:hover { background: rgba(191,90,242,0.12); }

.cat-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.cat-group-tag {
  font-size: 11px; padding: 3px 10px;
  border: 1px solid rgba(191,90,242,0.3);
  color: var(--purple); border-radius: 100px; font-weight: 600;
}
[data-theme="light"] .cat-group-tag { font-size: 11px; }

#f_cat_wrapper, #f_cat_sub_wrapper { position: relative; }

/* ═══════════════════════════════════════
   BOOT SCREEN
═══════════════════════════════════════ */
#bootScreen {
  position: fixed; inset: 0;
  background: #000000;
  z-index: 99999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: var(--font-sf);
  cursor: pointer;
  transition: opacity 0.7s ease;
}
#bootScreen.fade-out { opacity: 0; pointer-events: none; }

/* Remove scan line */
#bootScreen::after { display: none; }

/* Glass boot screen background */
#bootScreen::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(10,132,255,0.20) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(94,92,230,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.boot-wrap {
  width: 88%; max-width: 340px;
  position: relative; z-index: 1;
}

.boot-logo {
  font-family: var(--font-sf);
  font-size: 34px; font-weight: 700;
  color: #ffffff;
  text-align: center;
  letter-spacing: -1px;
  margin-bottom: 4px;
  text-shadow: none;
  animation: bootLogoIn 0.6s cubic-bezier(0.2,0,0,1) both;
}

@keyframes bootLogoIn {
  0%  { opacity: 0; transform: scale(0.85) translateY(16px); }
  100%{ opacity: 1; transform: scale(1) translateY(0); }
}

.boot-tagline {
  font-size: 12px; color: rgba(255,255,255,0.45);
  text-align: center; margin-bottom: 36px;
  font-weight: 400; letter-spacing: 0.3px;
  opacity: 0;
  animation: fadeSlideUp 0.4s 0.4s forwards;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.boot-terminal {
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  background: rgba(255,255,255,0.06);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  margin-bottom: 16px;
  min-height: 108px;
  position: relative;
  overflow: hidden;
}
.boot-terminal::before { display: none; }

.boot-line {
  font-size: 12px; line-height: 2;
  white-space: nowrap; overflow: hidden;
  color: rgba(255,255,255,0.35);
  animation: lineIn 0.15s ease forwards;
}
@keyframes lineIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
.boot-line.ok   { color: rgba(48,209,88,0.8); }
.boot-line.ok::after  { content: ' ✓'; opacity: 0.7; }
.boot-line.warn { color: rgba(255,214,10,0.8); }
.boot-line.grant { color: rgba(10,132,255,0.9); font-weight: 600; font-size: 13px; }

.boot-progress-track {
  height: 3px; background: rgba(255,255,255,0.10);
  border-radius: 100px; margin-bottom: 10px; overflow: hidden;
}
.boot-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--indigo), var(--blue));
  transition: width 0.35s ease;
  border-radius: 100px;
}

.boot-footer { display: flex; justify-content: space-between; align-items: center; }
.boot-status-txt { font-size: 11px; color: rgba(255,255,255,0.3); }
.boot-skip-txt { font-size: 11px; color: rgba(255,255,255,0.15); animation: blinkFade 1.2s 1.5s ease infinite; }
@keyframes blinkFade { 0%,100% { opacity: 0.5; } 50% { opacity: 0.15; } }

/* ═══════════════════════════════════════
   PHOTO
═══════════════════════════════════════ */
.photo-upload-area {
  border: 1px dashed var(--border2);
  border-radius: var(--radius-md);
  padding: 16px 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; transition: border-color 0.2s, background 0.2s;
  color: var(--text3); font-size: 13px; font-weight: 500;
}

.photo-upload-area:hover { border-color: var(--accent); background: var(--tab-act); }
.photo-thumb { width: 100%; max-height: 160px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 8px; }

/* ═══════════════════════════════════════
   WEEK VIEW STRIP
═══════════════════════════════════════ */
.week-nav-wrap { margin-bottom: 8px; }
.week-nav-year { font-size: 12px; color: var(--text3); text-align: center; margin-bottom: 2px; font-weight: 500; }

.week-strip {
  display: flex; flex-direction: column;
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden; margin-bottom: 14px;
}

.week-strip-header {
  display: grid; grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
}

.week-strip-dates {
  display: grid; grid-template-columns: repeat(7, 1fr);
}

.week-strip-dow {
  font-size: 11px; color: var(--text3); text-align: center;
  padding: 6px 2px 4px; font-weight: 600;
}
.week-strip-dow.sun { color: var(--red); }
.week-strip-dow.sat { color: var(--blue); }
.week-strip-dow.today-col { color: var(--accent); }

.week-strip-day {
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 2px 8px;
  cursor: pointer;
  transition: background 0.15s;
  gap: 4px;
}
.week-strip-day:hover { background: var(--glass3); }
.week-strip-day.sun .week-strip-num { color: var(--red); }
.week-strip-day.sat .week-strip-num { color: var(--blue); }
[data-theme="light"] .week-strip-day.sat .week-strip-num { color: var(--accent); }

.week-strip-num {
  font-size: 14px; font-weight: 600;
  color: var(--text2);
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: all 0.15s;
}
.week-strip-day.today .week-strip-num {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}
.week-strip-day.selected:not(.today) .week-strip-num {
  background: var(--tab-act);
  outline: 2px solid var(--accent);
  color: var(--accent);
}
.week-event-dots { display: flex; gap: 2px; justify-content: center; }
.week-event-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.week-strip-day.today .week-event-dot { background: rgba(255,255,255,0.6) !important; }

.week-day-list-header {
  font-family: var(--font-main);
  font-size: 16px; color: var(--text); font-weight: 700; letter-spacing: -0.3px;
  padding: 10px 4px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}
[data-theme="light"] .week-day-list-header { font-size: 16px; color: var(--text); }

.week-empty { text-align: center; padding: 24px 20px; color: var(--text3); font-size: 13px; }

.week-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin: 0 0 12px; }
.week-cell { background: transparent; padding: 4px 2px; cursor: pointer; transition: background 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: var(--radius-sm); }
.week-cell:hover { background: var(--glass2); }
.week-cell.today .week-daynum { background: var(--accent); border-radius: 50%; color: #fff; font-weight: 700; }
.week-cell.selected:not(.today) { background: var(--glass2); border-radius: var(--radius-sm); outline: 1px solid var(--accent); }
.week-cell.sun .week-daynum { color: var(--red); }
.week-cell.sat .week-daynum { color: var(--blue); }
.week-daynum { font-size: 14px; color: var(--text2); text-align: center; font-weight: 600; line-height: 1.8; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.week-cell-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.week-cell.today .week-cell-dot { background: var(--bg); }

#weekDayTasks { margin-top: 4px; }
.wdt-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 10px 4px 8px; border-bottom: 1px solid var(--border); }
.wdt-date-title { font-family: var(--font-main); font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.wdt-date-dow { font-size: 13px; color: var(--text3); margin-left: 6px; font-weight: 500; }
.wdt-progress { display: flex; align-items: center; gap: 8px; }
.wdt-pct {
  font-size: 12px; color: var(--text3); font-weight: 600;
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 3px 12px;
}
.wdt-add-btn {
  background: var(--accent); color: #fff;
  border: none; border-radius: 50%; width: 32px; height: 32px;
  font-size: 20px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.2s;
  box-shadow: 0 2px 8px rgba(10,132,255,0.4);
}
.wdt-add-btn:hover { opacity: 0.8; }
.wdt-complete-count { font-size: 12px; color: var(--text3); margin-bottom: 8px; font-weight: 500; }
.wdt-empty { text-align: center; padding: 32px 20px; color: var(--text3); font-size: 13px; }

/* ══ NOTIF BUTTON ══ */
.notif-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border2);
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  color: var(--text2);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all 0.2s;
  flex-shrink: 0;
  opacity: 0.5;
}
.notif-btn.on { opacity: 1; border-color: var(--accent); }
.notif-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

.pwa-bar-text { font-size: 13px; color: var(--text2); font-weight: 500; flex: 1; }
.pwa-bar-btns { display: flex; gap: 8px; }
.pwa-btn-install {
  background: var(--accent); color: #fff;
  border: none; padding: 8px 16px;
  font-family: var(--font-main); font-size: 13px;
  cursor: pointer; font-weight: 700; border-radius: var(--radius-sm);
}
.pwa-btn-dismiss { background: var(--glass2); border: 1px solid var(--border); color: var(--text3); padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: var(--radius-sm); }

/* ══ 가계부 LEDGER ══ */
.ledger-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.ledger-sum-box {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px; text-align: center;
}
.ledger-sum-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; font-weight: 600; }
.ledger-sum-val { font-size: 14px; font-weight: 700; }
.ledger-sum-val.income { color: var(--green); }
.ledger-sum-val.expense { color: var(--red); }
.ledger-sum-val.balance { color: var(--accent); }

.ledger-month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-top: 10px; }
.ledger-month-label { font-family: var(--font-main); font-size: 15px; color: var(--text); font-weight: 700; letter-spacing: -0.3px; }
.ledger-nav-btn {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border); color: var(--accent);
  width: 30px; height: 30px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
}
.ledger-add-btn {
  width: 100%; padding: 11px; margin-top: 12px;
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px dashed var(--border2); color: var(--accent);
  font-family: var(--font-main); font-size: 14px; cursor: pointer;
  transition: all 0.2s; border-radius: var(--radius-sm); font-weight: 600;
}
.ledger-add-btn:hover { background: var(--tab-act); }

.ledger-entry { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.ledger-entry:last-child { border-bottom: none; }
.ledger-entry-date { font-size: 11px; color: var(--text3); min-width: 36px; font-weight: 500; }
.ledger-entry-info { flex: 1; min-width: 0; }
.ledger-entry-title { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.ledger-entry-cat { font-size: 11px; color: var(--text3); margin-top: 1px; }
.ledger-entry-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }
.ledger-entry-amount.income { color: var(--green); }
.ledger-entry-amount.expense { color: var(--red); }
.ledger-entry-del { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 0 2px; }

.ledger-type-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden; margin-bottom: 14px;
  background: var(--glass3);
}
.ledger-type-btn {
  flex: 1; padding: 11px; border: none; background: none; cursor: pointer;
  font-family: var(--font-main); font-size: 14px; color: var(--text3);
  transition: all 0.2s; font-weight: 600;
}
.ledger-type-btn.income.active { background: rgba(48,209,88,0.15); color: var(--green); }
.ledger-type-btn.expense.active { background: rgba(255,69,58,0.12); color: var(--red); }

/* Calendar ledger marker */
.cal-ledger-bar { display: flex; gap: 1px; justify-content: center; margin-top: 1px; }
.cal-ledger-pip { width: 4px; height: 4px; border-radius: 50%; }

/* FAB add button */
.fab-add {
  position: fixed; bottom: 80px; right: 18px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; font-size: 26px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(10,132,255,0.45);
  z-index: 500; transition: transform 0.2s, box-shadow 0.2s;
}
[data-theme="light"] .fab-add { box-shadow: 0 4px 20px rgba(0,122,255,0.35); }
.fab-add:active { transform: scale(0.93); }

/* ══ 달력 서브탭 ══ */
.cal-subtab-bar {
  display: flex;
  gap: 0;
  margin-bottom: 14px;
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 3px;
  overflow: hidden;
}
.cal-subtab {
  flex: 1;
  padding: 7px 10px;
  background: none;
  border: none;
  color: var(--text3);
  font-family: var(--font-main);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 100px;
  transition: all 0.2s;
}
.cal-subtab.active {
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 1px 6px rgba(0,0,0,0.15);
}
[data-theme="dark"] .cal-subtab.active { background: rgba(255,255,255,0.12); }

/* ── nickname display ── */
.nickname-display {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0 10px;
}
.nickname-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--indigo));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(10,132,255,0.35);
}
.nickname-current { font-family: var(--font-main); font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
[data-theme="dark"] .nickname-current { color: var(--text); text-shadow: none; }
.nickname-sub { font-size: 12px; color: var(--text3); margin-top: 3px; font-weight: 400; }

/* ══ 메모 카드 ══ */
.memo-item {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-left: 3px solid var(--yellow);
  padding: 12px 14px; margin-bottom: 8px;
  border-radius: var(--radius-md); cursor: pointer; position: relative;
  clip-path: none;
  box-shadow: var(--shadow2);
}
[data-theme="dark"] .memo-item { clip-path: none; border-radius: var(--radius-md); }
.memo-item:active { opacity: 0.75; }
.memo-item-date { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
.memo-item-content { font-size: 14px; color: var(--text); line-height: 1.5; white-space: pre-wrap; }
.memo-item-del { position:absolute; top:10px; right:10px; background:none; border:none; color:var(--text3); font-size:16px; cursor:pointer; }
.memo-empty { text-align:center; color:var(--text3); padding:30px 0; font-size:13px; }

/* ═══════════════════════════════════════
   UX OPTIMIZATIONS
═══════════════════════════════════════ */
button:focus-visible,
[role="button"]:focus-visible,
.tab-item:focus-visible,
.cal-subtab:focus-visible,
.fchip:focus-visible,
.theme-btn:focus-visible,
.notif-btn:focus-visible,
.today-btn:focus-visible,
.add-btn:focus-visible,
.cal-arrow:focus-visible,
.cal-today-btn:focus-visible,
.prio-btn:focus-visible,
.btn-cancel:focus-visible,
.btn-save:focus-visible,
.modal-close:focus-visible,
.fab-add:focus-visible,
.toggle-switch:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:focus:not(:focus-visible),
.tab-item:focus:not(:focus-visible) { outline: none; }

button,
.tab-item,
.cal-subtab,
.fchip,
.todo-card,
.cal-cell,
.cal-dot,
.week-strip-day,
.mp-card-header,
.memo-item,
.subs-item,
.ledger-entry,
.detail-btn,
.prio-btn,
.hbadge,
.toggle-switch {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.theme-btn, .notif-btn { min-width: 34px; min-height: 34px; }
.tab-item { min-height: 48px; }
.modal-close { min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); transition: background 0.15s, color 0.15s; }
.modal-close:hover { background: var(--glass2); }

body, .app-header, .tab-bar, .mp-card, .modal-sheet, .fab-add,
.form-input, .form-select, .form-textarea,
.btn-save, .btn-cancel, .today-btn, .add-btn {
  transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.fab-add:hover { transform: scale(1.06); box-shadow: 0 8px 28px rgba(10,132,255,0.55); }
[data-theme="light"] .fab-add:hover { box-shadow: 0 8px 28px rgba(0,122,255,0.40); }
.toggle-switch { -webkit-tap-highlight-color: transparent; }
.fchip { transition: all 0.18s ease; }
.fchip:hover:not(.active) { border-color: var(--accent); color: var(--text); }

/* ── TOAST NOTIFICATIONS ── */
#toastContainer {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: calc(100% - 32px);
  max-width: 448px;
}

.toast {
  pointer-events: auto;
  background: var(--panel);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  color: var(--text);
  padding: 14px 16px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-family: var(--font-main);
  font-weight: 500;
  animation: toastIn 0.3s cubic-bezier(.4,0,.2,1);
  clip-path: none;
}
[data-theme="dark"] .toast { background: rgba(28,28,40,0.92); clip-path: none; }

.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
.toast.info { border-left-color: var(--accent); }
.toast-icon { font-size: 18px; line-height: 1; flex-shrink: 0; }
.toast-msg { flex: 1; line-height: 1.3; }
.toast-action {
  background: var(--tab-act);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  flex-shrink: 0;
  transition: all 0.15s;
}
.toast-action:hover { background: rgba(10,132,255,0.2); }
.toast.out { animation: toastOut 0.2s ease forwards; }

@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-14px); } }

/* ── CUSTOM CONFIRM DIALOG ── */
.confirm-sheet {
  width: min(320px, calc(100% - 32px)) !important;
  background: var(--panel) !important;
  -webkit-backdrop-filter: var(--blur) !important;
  backdrop-filter: var(--blur) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-xl) !important;
  padding: 28px 22px 18px !important;
  text-align: center;
  animation: confirmIn 0.22s cubic-bezier(.4,0,.2,1);
  clip-path: none !important;
}
[data-theme="dark"] .confirm-sheet { background: rgba(22,22,32,0.95) !important; clip-path: none !important; }

.confirm-icon { font-size: 36px; margin-bottom: 12px; display: block; }
.confirm-msg {
  font-size: 15px; color: var(--text); line-height: 1.5;
  margin-bottom: 20px; font-family: var(--font-main); font-weight: 500;
}
[data-theme="dark"] .confirm-msg { font-family: var(--font-sf); }

.confirm-actions { display: flex; gap: 10px; }
.confirm-ok.danger { background: var(--red); border-color: var(--red); color: #fff; }
.confirm-ok.danger:hover { opacity: 0.9; }

@keyframes confirmIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

/* ── SKELETON LOADER ── */
.skeleton-card {
  background: var(--glass2);
  -webkit-backdrop-filter: var(--blur-sm);
  backdrop-filter: var(--blur-sm);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 6px;
  overflow: hidden;
  position: relative;
}
.skeleton-card::after {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
  animation: shimmer 1.6s infinite;
}
@keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }

/* ── DONE ANIMATION ── */
.todo-card .todo-row { position: relative; overflow: visible; }
.todo-card .todo-row::before {
  content: '';
  position: absolute;
  left: -16px; top: 50%;
  width: 16px; height: 16px;
  background: var(--green);
  border-radius: 50%;
  transform: translateY(-50%) scale(0);
  opacity: 0;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
  pointer-events: none;
}
.todo-card.just-done .todo-row::before { transform: translateY(-50%) scale(1); opacity: 1; }

/* ── CALENDAR HEATMAP ── */
.cal-cell[data-density="1"] { background: rgba(10,132,255,0.05); }
.cal-cell[data-density="2"] { background: rgba(10,132,255,0.09); }
.cal-cell[data-density="3"] { background: rgba(10,132,255,0.14); }
[data-theme="dark"] .cal-cell[data-density="1"] { background: rgba(10,132,255,0.06); }
[data-theme="dark"] .cal-cell[data-density="2"] { background: rgba(10,132,255,0.10); }
[data-theme="dark"] .cal-cell[data-density="3"] { background: rgba(10,132,255,0.16); }
[data-theme="dark"] .cal-cell.today[data-density] { background: rgba(10,132,255,0.18); }
[data-theme="light"] .cal-cell.today[data-density] { background: rgba(0,122,255,0.12); }

/* ── SEARCH ── */
.search-input-wrap { position: relative; }
.search-input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-main);
  font-size: 16px; font-weight: 400;
  padding: 13px 14px 13px 42px;
  outline: none;
  border-radius: var(--radius-md);
  -webkit-appearance: none;
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }
.search-icon-prefix { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:16px; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  body::before, body::after { display: none !important; }
  [data-theme="dark"] .header-title { animation: none !important; }
}

/* ═══════════════════════════════════════════════════════════
   PC / DESKTOP LAYOUT  (≥ 900px)
═══════════════════════════════════════════════════════════ */
@media (min-width: 900px) {

  html, body { overflow: hidden; height: 100%; }

  #app {
    max-width: 100%;
    height: 100dvh;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:

  }

  .app-header {
    grid-area: sidebar;

    flex-direction: column;
    border-bottom: none;
    border-right: 1px solid var(--border);

    height: 100dvh;
    overflow-y: auto;

  }

  [data-theme="dark"] .app-header {
    border-right-color: rgba(255,255,255,0.10);
  }

  [data-theme="dark"] .app-header::after { display: none; }

  .header-top { flex-direction: column; gap: 0; align-items: flex-start; }
  .header-controls { flex-direction: row; padding-top: 20px; gap: 10px; align-items: center; }
  .header-sys { font-size: 11px; }
  .header-title { font-size: 24px; margin-top: 6px; height: auto; }
  .header-badges { margin-top: 12px; }

  .tab-bar {
    flex-direction: column;
    border-top: none;
    border-right: none;
    background: transparent;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    padding: 0;
    margin-top: auto;
    padding-top: 28px;
    gap: 4px;
  }

  .tab-item {
    flex-direction: row;
    justify-content: flex-start;
    padding: 11px 16px;
    border-radius: var(--radius-sm);
    gap: 14px;
    border: 1px solid transparent;
    transition: all 0.18s;
    min-height: 44px;
  }
  .tab-item:hover { background: var(--glass2); border-color: var(--border); }
  .tab-item.active { background: var(--tab-act); border-color: rgba(10,132,255,0.3); }
  [data-theme="dark"] .tab-item.active { border-color: rgba(10,132,255,0.3); background: rgba(10,132,255,0.12); }
  .tab-item::before { display: none; }
  .tab-icon { font-size: 18px; }
  .tab-label { font-size: 13px; letter-spacing: 0.2px; }

  .pc-topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    height: 50px;
    flex-shrink: 0;
    gap: 16px;
  }
  [data-theme="dark"] .pc-topbar { background: rgba(12,12,18,0.70); }

  .pc-topbar-title {
    font-family: var(--font-main);
    font-size: 14px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: -0.2px;
  }
  .pc-topbar-spacer { flex: 1; }

  #mainContent {
    grid-area: main;
    padding: 0;
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #viewCal { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  #viewCal .cal-nav { flex-shrink: 0; }
  #viewCal #calGrid {
    flex: 1;
    column-gap: 2px;
    row-gap: 2px;
    grid-template-rows: auto repeat(6, 1fr);
    min-height: 0;
  }
  #viewCal #calDayList { flex-shrink: 0; }
  .cal-cell { height: auto; min-height: 0; }

  #mainContent > .view { display: none !important; }
  #mainContent > .view.active {
    display: flex !important;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    padding: 24px 32px 0;
  }

  #viewCalendar .cal-subtab-bar { flex-shrink: 0; }
  .cal-subview { display: none !important; }

  #viewCal.cal-subview.active,
  .cal-subview.active {
    display: flex !important;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  #viewList.cal-subview.active,
  #viewWeek.cal-subview.active {
    overflow: visible;
    padding-bottom: 0;
  }

  #viewList .action-bar { flex-shrink: 0; }
  #viewList .filter-scroll { flex-shrink: 0; }
  #viewList #todoList {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 40px;
    min-height: 0;
  }

  #viewWeek {
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 40px;
  }

  .cal-dow { font-size: 13px; padding: 10px 0; font-weight: 600; }
  #calGrid { margin-top: 0 !important; }
  .cal-daynum { font-size: 13px !important; margin-bottom: 6px; }
  .cal-dot { font-size: 11px !important; padding: 3px 8px !important; margin-bottom: 3px !important; line-height: 1.5 !important; }
  .cal-more { font-size: 10px !important; }

  .todo-card:hover { transform: translateX(2px); }

  #fabAdd { bottom: 32px; right: 32px; width: 54px; height: 54px; font-size: 28px; }
  .modal-box { max-width: 520px; width: 90vw; }
  .detail-box { max-width: 560px; width: 90vw; }
  .search-box { max-width: 540px; width: 90vw; }
  .week-strip { gap: 4px; }

}

/* ── PC 전용 topbar HTML 요소 (JS로 삽입) ── */
.pc-topbar { display: none; }

@media (min-width: 900px) {
  .pc-topbar { display: flex; }
}

<body>



<!-- BOOT SCREEN -->

<div id="bootScreen" onclick="skipBoot()" role="status" aria-label="시스템 부팅 중. 탭하여 건너뛰기">

  <div class="boot-wrap">

    <div class="boot-logo">RIANLESS</div>

    <div class="boot-tagline">개인 일정 관리 시스템</div>

    <div class="boot-terminal" id="bootTerminal"></div>

    <div class="boot-progress-track">

      <div class="boot-progress-fill" id="bootProgress"></div>

    </div>

    <div class="boot-footer">

      <span class="boot-status-txt" id="bootStatusTxt">준비 중...</span>

      <span class="boot-skip-txt">탭하여 건너뛰기</span>

    </div>

  </div>

</div>



<div id="app">



  <!-- ── HEADER ── -->

  <header class="app-header" role="banner">

    <div class="header-top">

      <div class="header-left">

        <div class="header-sys" id="headerSys" aria-hidden="true">Rianless</div>

        <h1 class="header-title">To Do<span> List</span></h1>

        <div class="header-badges" aria-hidden="true">

          <span class="hbadge hbadge-c" id="hb1">오늘</span>

          <span class="hbadge hbadge-m" id="hb2">동기화</span>

          <span class="hbadge hbadge-p" id="hb3">v2.7.1</span>

        </div>

      </div>

      <div class="header-controls" role="toolbar" aria-label="헤더 도구">

        <button class="notif-btn" id="notifBtn" onclick="toggleNotif()" title="알림" aria-label="알림 설정">🔔</button>

        <button class="theme-btn" onclick="openSearch()" title="검색" aria-label="검색 열기">🔍</button>

        <button class="theme-btn" onclick="toggleTheme()" title="테마 전환" id="themeBtn" aria-label="테마 전환">☀️</button>

      </div>

    </div>

    <div class="progress-bar-wrap" role="progressbar" aria-label="오늘 일정 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progBarWrap">

      <div class="prog-label" id="progLabel" aria-hidden="true">SYS_LOAD</div>

      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>

      <div class="prog-pct" id="progPct">0%</div>

    </div>

    <div class="header-sys-extra" id="sysExtraLine" aria-hidden="true"></div>

  </header>



  <!-- ── MAIN CONTENT ── -->

  <main id="mainContent" role="main">



    <!-- ══ 달력 메인 뷰 ══ -->

        <button class="cal-subtab" id="cst-week" onclick="setCalSubTab('week',this)">주</button>

        <button class="cal-subtab" id="cst-list" onclick="setCalSubTab('list',this)">리스트</button>

      </div>



      <!-- MONTH CALENDAR VIEW -->

        <div class="cal-nav">

          <button class="cal-arrow" onclick="calMove(-1)">‹</button>

          <div class="cal-month" id="calLabel"></div>

          <div class="cal-nav-right">

            <button class="cal-arrow" onclick="calMove(1)">›</button>

            <button class="cal-today-btn" onclick="calGoToday()">TODAY</button>

          </div>

        </div>

        <div class="cal-grid" id="calGrid"></div>

        <div id="calDayList" style="margin-top:12px;"></div>

      </div>



      <!-- WEEK VIEW -->

        <div class="week-nav-wrap">

          <div class="week-nav-year" id="weekNavYear"></div>

          <div class="cal-nav">

            <button class="cal-arrow" onclick="weekMove(-1)">‹</button>

            <div class="cal-month" id="weekLabel"></div>

            <div class="cal-nav-right">

              <button class="cal-arrow" onclick="weekMove(1)">›</button>

              <button class="cal-today-btn" onclick="weekGoToday()">TODAY</button>

            </div>

          </div>

        </div>

      </div>

    </div>



    <!-- ══ 카테고리 메인 뷰 ══ -->

      <div class="mypage-cards">



        <!-- ── 구독 카드 ── -->

        <div class="mp-card open" id="mpCardSubs">

          <div class="mp-card-header" onclick="toggleMpCard('mpCardSubs')">

            <span class="mp-card-icon">🔖</span>

            <span class="mp-card-label" id="subsSysLabel">구독</span>

            </div>

          </div>

        </div>



        <!-- ── 가계부 카드 ── -->

        <div class="mp-card" id="mpCardLedger">

          <div class="mp-card-header" onclick="toggleMpCard('mpCardLedger')">

            <span class="mp-card-icon">💰</span>

            <span class="mp-card-label" id="ledgerSysLabel">가계부</span>

            <span class="mp-card-chevron">▼</span>

          </div>

          <div class="mp-card-body">

            <div class="mp-card-inner">

              <div class="ledger-month-nav">

          </div>

        </div>

          <div class="mp-card-header" onclick="toggleMpCard('mpCardMemo')">

            <span class="mp-card-icon">📝</span>

            <span class="mp-card-label" id="memoSysLabel">메모</span>

            <span class="mp-card-chevron">▼</span>

          </div>

          <div class="mp-card-body">

            <div class="mp-card-inner">

              <div id="memoList"></div>

              <button class="ledger-add-btn" style="margin-top:10px;" onclick="openMemoAdd()">+ 메모 추가</button>

            </div>

          </div>

        </div>



      </div>

    </div>



    <!-- ══ 마이페이지 메인 뷰 ══ -->

    <div class="view" id="viewMypage">

      <div class="mypage-cards">



        <!-- ── 닉네임 설정 카드 ── -->

        <div class="mp-card open" id="mpCardNickname">

          <div class="mp-card-header" onclick="toggleMpCard('mpCardNickname')">

            <span class="mp-card-icon">👤</span>

            <span class="mp-card-label">닉네임 설정</span>

            <span class="mp-card-chevron">▼</span>

          </div>

          <div class="mp-card-body">

            <div class="mp-card-inner">

              <div class="nickname-display" id="nicknameDisplay">

                <div class="nickname-avatar" id="nicknameAvatar">R</div>
