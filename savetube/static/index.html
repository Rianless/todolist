<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaveTube</title>
<meta name="theme-color" content="#16141f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16141f; --card:#211e2e; --line:#332f45; --text:#efedf7; --sub:#9b96b3;
    --accent:#ff6b5c; --accent2:#7c6cff; --ok:#3ecf8e; --err:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;
       min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) 16px 40px;-webkit-tap-highlight-color:transparent}
  main{max-width:480px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin:8px 0 22px}
  header img{width:34px;height:34px;border-radius:9px}
  h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  label.t{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
  .row{display:flex;gap:8px}
  input[type=url],input[type=password]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent2)}
  button{font-family:inherit;border:0;cursor:pointer;border-radius:12px;font-size:15px;font-weight:500}
  .ghost{background:var(--line);color:var(--text);padding:0 14px;white-space:nowrap}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .seg button{background:var(--bg);border:1.5px solid var(--line);color:var(--sub);padding:14px 8px;line-height:1.35}
  .seg button b{display:block;font-size:16px;color:var(--text)}
  .seg button.on{border-color:var(--accent);background:rgba(255,107,92,.08)}
  .seg button.on.mp3{border-color:var(--accent2);background:rgba(124,108,255,.1)}
  select{width:100%;margin-top:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);
         border-radius:12px;padding:12px;font-size:14px;font-family:inherit}
  .go{width:100%;margin-top:14px;padding:15px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
  .go.mp3{background:var(--accent2)}
  .go:disabled{opacity:.45}
  .preview{display:none;gap:12px;align-items:center}
  .preview.show{display:flex}
  .preview img{width:96px;height:54px;object-fit:cover;border-radius:8px;background:var(--line);flex-shrink:0}
  .preview .tt{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .preview .meta{font-size:12px;color:var(--sub);margin-top:3px}
  .status{display:none}
  .status.show{display:block}
  .bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 8px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .bar.busy i{width:35%!important;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .stage{font-size:14px;display:flex;justify-content:space-between;color:var(--sub)}
  .msg{font-size:14px;line-height:1.5}
  .msg.err{color:var(--err)}
  .save{display:none;width:100%;margin-top:12px;padding:14px;background:var(--ok);color:#0b2a1c;font-weight:700;text-align:center;
        text-decoration:none;border-radius:12px}
  .save.show{display:block}
  .tip{font-size:12px;color:var(--sub);line-height:1.6;padding:0 4px}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <header>
    <img src="/icon-192.png" alt="">
    <h1>SaveTube</h1>
  </header>

  <section class="card hidden" id="pwCard">
    <label class="t" for="pw">비밀번호</label>
    <div class="row">
      <input type="password" id="pw" placeholder="서버 비밀번호" autocomplete="current-password">
      <button class="ghost" id="pwSave">저장</button>
    </div>
  </section>

  <section class="card">
    <label class="t" for="url">동영상 링크</label>
    <div class="row">
      <input type="url" id="url" placeholder="https://..." inputmode="url" autocomplete="off">
      <button class="ghost" id="paste">붙여넣기</button>
    </div>

    <div class="seg" id="seg">
      <button data-kind="video" class="on"><b>영상</b>MP4</button>
      <button data-kind="mp3" class="mp3"><b>소리만</b>MP3</button>
    </div>
    <select id="quality"></select>

    <button class="go" id="go">저장하기</button>
  </section>

  <section class="card preview" id="preview">
    <img id="thumb" alt="">
    <div>
      <div class="tt" id="title"></div>
      <div class="meta" id="meta"></div>
    </div>
  </section>

  <section class="card status" id="status">
    <div class="stage"><span id="stage">준비 중</span><span id="pct"></span></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="msg" id="msg"></div>
    <a class="save" id="save" download>폰에 저장</a>
  </section>

  <p class="tip">
    홈 화면에 추가해 두면 유튜브 앱 등에서 <b>공유 → SaveTube</b>로 링크를 바로 보낼 수 있어요.
    저장한 파일은 폰의 <b>다운로드</b> 폴더에 들어가요. 본인이 권리를 가졌거나 저장이 허락된 콘텐츠에만 사용하세요.
  </p>
</main>

<script>
const $ = id => document.getElementById(id);
const QUAL = {
  video: [["best","최고 화질"],["1080","1080p"],["720","720p (용량 절약)"],["480","480p"]],
  mp3:   [["192","192kbps (기본)"],["320","320kbps (고음질)"],["128","128kbps (작은 용량)"]],
};
let kind = "video", pollTimer = null, infoTimer = null, currentJob = null;

const store = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch {} },
};
const key = () => store.get("savetube-key") || "";

function setKind(k){
  kind = k;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.kind === k));
  $("quality").innerHTML = QUAL[k].map(([v,t]) => `<option value="${v}">${t}</option>`).join("");
  $("go").classList.toggle("mp3", k === "mp3");
  $("go").textContent = k === "mp3" ? "MP3로 저장하기" : "영상으로 저장하기";
}
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => setKind(b.dataset.kind));
setKind("video");

async function api(path, body){
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", "X-App-Key": key() },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "서버 오류가 났어요.");
  return data;
}

function fmtTime(s){
  if (!s) return "";
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(Math.floor(s%60)).padStart(2,"0");
  return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`;
}
function fmtSize(b){
  if (!b) return "";
  return b > 1e9 ? (b/1e9).toFixed(2)+"GB" : (b/1e6).toFixed(1)+"MB";
}

function extractUrl(text){
  const m = (text || "").match(/https?:\/\/[^\s<>"']+/);
  return m ? m[0] : "";
}

async function loadInfo(){
  const url = extractUrl($("url").value);
  if (!url) { $("preview").classList.remove("show"); return; }
  try {
    const d = await api("/api/info", { url });
    $("thumb").src = d.thumbnail || "";
    $("title").textContent = d.title;
    $("meta").textContent = [d.uploader, fmtTime(d.duration)].filter(Boolean).join(" · ");
    $("preview").classList.add("show");
  } catch (e) {
    $("preview").classList.remove("show");
  }
}
$("url").addEventListener("input", () => { clearTimeout(infoTimer); infoTimer = setTimeout(loadInfo, 600); });

$("paste").onclick = async () => {
  try {
    const t = await navigator.clipboard.readText();
    $("url").value = extractUrl(t) || t;
    loadInfo();
  } catch {
    $("url").focus();
    showMsg("이 브라우저에선 붙여넣기 버튼이 막혀 있어요. 입력칸을 길게 눌러 붙여넣어 주세요.");
  }
};

function showStatus(){ $("status").classList.add("show"); }
function showMsg(t, err){ showStatus(); $("msg").textContent = t; $("msg").classList.toggle("err", !!err); }

$("go").onclick = async () => {
  const url = extractUrl($("url").value);
  if (!url) return showMsg("링크를 먼저 넣어 주세요.", true);
  clearTimeout(pollTimer); currentJob = null;
  $("go").disabled = true;
  $("save").classList.remove("show");
  $("fill").style.width = "0";
  $("bar").classList.add("busy");
  $("stage").textContent = "준비 중"; $("pct").textContent = "";
  showMsg("");
  try {
    const { id } = await api("/api/jobs", { url, kind, quality: $("quality").value });
    currentJob = id;
    poll(id);
  } catch (e) {
    $("bar").classList.remove("busy");
    showMsg(e.message, true);
    $("go").disabled = false;
  }
};

// 이전 확인이 끝난 뒤에만 다음 확인을 해서, '완료'를 두 번 처리하지 않게 함
async function poll(id){
  if (id !== currentJob) return;
  let j;
  try { j = await api(`/api/jobs/${id}?key=${encodeURIComponent(key())}`); }
  catch (e) { pollTimer = setTimeout(() => poll(id), 1500); return; }
  if (id !== currentJob) return;
  if (j.status === "done" || j.status === "error") currentJob = null;
  else pollTimer = setTimeout(() => poll(id), 1000);
  $("stage").textContent = j.stage;
  const busy = j.status === "queued" || j.status === "processing" || (j.status === "downloading" && !j.progress);
  $("bar").classList.toggle("busy", busy);
  if (j.status === "downloading" && j.progress) {
    $("fill").style.width = j.progress + "%";
    $("pct").textContent = Math.floor(j.progress) + "%";
  }
  if (j.status === "done") {
    $("fill").style.width = "100%"; $("pct").textContent = fmtSize(j.size);
    const href = `/api/jobs/${id}/file?key=${encodeURIComponent(key())}`;
    $("save").href = href;
    $("save").textContent = j.filename.endsWith(".mp3") ? "MP3 폰에 저장" : "영상 폰에 저장";
    $("save").classList.add("show");
    showMsg(j.filename);
    $("go").disabled = false;
    $("stage").textContent = "준비 완료 · 아래 버튼을 눌러 저장하세요";
  }
  if (j.status === "error") {
    $("bar").classList.remove("busy");
    showMsg(j.error, true);
    $("go").disabled = false;
  }
}

// 비밀번호
(async () => {
  try {
    const c = await api("/api/config");
    if (c.needsPassword && !key()) $("pwCard").classList.remove("hidden");
  } catch {}
})();
$("pwSave").onclick = () => { store.set("savetube-key", $("pw").value); $("pwCard").classList.add("hidden"); };

// 다른 앱에서 '공유'로 들어온 링크 처리
const p = new URLSearchParams(location.search);
const shared = extractUrl([p.get("url"), p.get("text"), p.get("title")].join(" "));
if (shared) { $("url").value = shared; loadInfo(); history.replaceState(null, "", "/"); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
