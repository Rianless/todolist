<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모 피드</title>
<style>
  :root {
    --line: #b9a4f5;
    --line-soft: #e4dbfb;
    --accent: #c4b0fb;
    --accent-strong: #8e6ff0;
    --text: #3b2a78;
    --muted: #8f85b3;
    --bg: #f4f0ff;
    --card: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px;
  }
  .win {
    width: 100%; max-width: 380px; height: min(640px, calc(100vh - 40px));
    display: flex; flex-direction: column; background: var(--card);
    border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(142, 111, 240, .18);
  }
  .title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: #f1ebff; border-bottom: 1px solid var(--line-soft);
    color: var(--accent-strong); font-weight: 600;
  }
  .composer { display: flex; gap: 10px; padding: 12px 12px 8px; }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #ffd6e8, #d6c8ff); display: grid; place-items: center;
    font-size: 18px; border: 1px solid var(--line-soft);
  }
  .composer-main { flex: 1; min-width: 0; }
  textarea {
    width: 100%; min-height: 64px; resize: none; padding: 8px 10px;
    border: 1px solid var(--line-soft); border-radius: 6px; background: #fff;
    font: inherit; color: var(--text); outline: none;
  }
  textarea::placeholder { color: #b6a7e6; }
  textarea:focus { border-color: var(--line); }
  .composer-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .count { color: var(--muted); font-size: 12px; }
  .count.over { color: #e0457b; }
  .send {
    border: 0; border-radius: 999px; padding: 5px 20px; font-weight: 700; letter-spacing: .5px;
    color: #fff; background: var(--accent); cursor: pointer; font-family: inherit;
  }
  .send:not(:disabled):hover { background: var(--accent-strong); }
  .send:disabled { opacity: .55; cursor: default; }
  .feed { flex: 1; overflow-y: auto; padding: 8px 12px 12px; background: #faf8ff; border-top: 1px solid var(--line-soft); }
  .post {
    display: flex; gap: 10px; padding: 10px; margin-top: 8px;
    background: #fff; border: 1px solid var(--line-soft); border-radius: 6px;
  }
  .post-body { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta b { color: var(--text); font-size: 13px; margin-right: 4px; }
  .content { margin: 4px 0 6px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .content a { color: var(--accent-strong); }
  .actions { display: flex; gap: 16px; color: var(--muted); font-size: 12px; }
  .actions button {
    border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer;
  }
  .actions button:hover { color: var(--accent-strong); }
  .actions .liked { color: #e0457b; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="win">
  <div class="title"><span>📝 memo</span><span id="total"></span></div>
  <div class="composer">
    <div class="avatar" aria-hidden="true">🎀</div>
    <div class="composer-main">
      <textarea id="input" maxlength="500" placeholder="무슨 일이 일어나고 있나요?" aria-label="메모 입력"></textarea>
      <div class="composer-bar">
        <span class="count" id="count">0/500</span>
        <button class="send" id="send" type="button" disabled>SEND</button>
      </div>
    </div>
  </div>
  <div class="feed" id="feed" aria-live="polite"></div>
</div>

<script>
(function () {
  var KEY = 'rianless_memo_feed';
  var MAX = 500;
  var posts = load();
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var count = document.getElementById('count');
  var feed = document.getElementById('feed');
  var total = document.getElementById('total');

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(posts)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function fmt(ts) {
    var d = new Date(ts);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    total.textContent = posts.length ? posts.length + '개' : '';
    if (!posts.length) {
      feed.innerHTML = '<div class="empty">아직 메모가 없어요.<br>위에 적고 SEND를 눌러보세요.</div>';
      return;
    }
    feed.innerHTML = posts.map(function (p) {
      return '<div class="post" data-id="' + p.id + '">' +
        '<div class="avatar" aria-hidden="true">🎀</div>' +
        '<div class="post-body">' +
          '<div class="meta"><b>Author</b>@user · ' + fmt(p.ts) + '</div>' +
          '<div class="content">' + linkify(p.text) + '</div>' +
          '<div class="actions">' +
            '<button type="button" data-act="like" class="' + (p.likes ? 'liked' : '') + '">♡ ' + (p.likes || 0) + '</button>' +
            '<button type="button" data-act="del">삭제</button>' +
          '</div>' +
        '</div></div>';
    }).join('');
  }

  function update() {
    var len = input.value.length;
    count.textContent = len + '/' + MAX;
    count.classList.toggle('over', len >= MAX);
    send.disabled = !input.value.trim();
  }

  function submit() {
    var text = input.value.trim();
    if (!text) return;
    posts.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), text: text, ts: Date.now(), likes: 0 });
    save();
    input.value = '';
    update();
    render();
    feed.scrollTop = 0;
    input.focus();
  }

  send.addEventListener('click', submit);
  input.addEventListener('input', update);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  });
  feed.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var id = btn.closest('.post').getAttribute('data-id');
    var idx = posts.findIndex(function (p) { return p.id === id; });
    if (idx < 0) return;
    if (btn.dataset.act === 'del') {
      if (!confirm('이 메모를 삭제할까요?')) return;
      posts.splice(idx, 1);
    } else {
      posts[idx].likes = posts[idx].likes ? 0 : 1;
    }
    save();
    render();
  });

  update();
  render();
})();
</script>
</body>
</html>
